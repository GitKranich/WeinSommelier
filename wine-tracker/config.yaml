name: "WeinSommelier"
description: "Weinkeller verwalten (basiert auf Wine Tracker von xenofex7)"
version: "1.12.2"
slug: "weinsommelier"
url: "https://github.com/GitKranich/WeinSommelier"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
environment:
  DATA_DIR: /share/weinsommelier
ports:
  5050/tcp: 5052
ports_description:
  5050/tcp: "WeinSommelier Web UI"
ingress: true
ingress_port: 5050
panel_icon: mdi:bottle-wine
panel_title: "WeinSommelier"
options:
  currency: "CHF"
  language: "de"
  ai_provider: "none"
  anthropic_api_key: ""
  anthropic_model: "claude-opus-4-8"
  openai_api_key: ""
  openai_model: "gpt-5.5"
  openrouter_api_key: ""
  openrouter_model: "anthropic/claude-opus-4.8"
  ollama_host: "http://localhost:11434"
  ollama_model: "llama3.2-vision"
  minimax_api_key: ""
  minimax_model: "MiniMax-M3"
  mistral_api_key: ""
  mistral_model: "mistral-medium-latest"
  chat_model: ""
  grapeminds_api_key: ""
schema:
  currency: str
  language: str
  ai_provider: list(none|anthropic|openai|openrouter|ollama|minimax|mistral)
  anthropic_api_key: str?
  anthropic_model: str?
  openai_api_key: str?
  openai_model: str?
  openrouter_api_key: str?
  openrouter_model: str?
  ollama_host: str?
  ollama_model: str?
  minimax_api_key: str?
  minimax_model: str?
  mistral_api_key: str?
  mistral_model: str?
  chat_model: str?
  grapeminds_api_key: password?
map:
  - share:rw
